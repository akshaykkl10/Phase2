services:
  db:
    image: postgres:17-alpine
    container_name: ticket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow@123
      POSTGRES_DB: ticketflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes: 
    - ticketflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  ticketflow_postgres_data: